<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>디아블로 IV 시즌 15 · 8직업 엔드게임 라이브러리</title>
<style>
:root{--gold:#c58e4d;--text:#ddd4c8}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -15%,#2a2119,#080808 44%,#040404 80%);color:var(--text);font-family:"Malgun Gothic",system-ui,sans-serif}
.shell{max-width:1500px;margin:auto;padding:10px 10px 60px} header,.hero,.section{border:1px solid #44372b;background:linear-gradient(180deg,#17130f,#0b0c0c);box-shadow:0 12px 30px #000}
header{padding:17px} .k{font-size:10px;letter-spacing:.2em;color:var(--gold)} h1{font:500 clamp(25px,5vw,43px) Georgia,serif;margin:6px 0} .sub{font-size:12px;line-height:1.7;color:#999187}
.tabs{display:flex;gap:7px;overflow:auto;padding:9px 1px;scrollbar-width:none} #classTabs{position:sticky;top:0;z-index:20;background:rgba(7,7,7,.95);backdrop-filter:blur(8px)}
.btn{flex:0 0 auto;border:1px solid #493d32;background:#151412;color:#bcb1a4;padding:10px 12px;font-weight:700} .btn.active{border-color:#aa7442;color:#f1e4d5;box-shadow:inset 0 -2px #a83729}
.hero{padding:16px;margin-top:3px} .hero h2{font:500 30px Georgia,serif;margin:2px 0} .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px} .badge{border:1px solid #594633;background:#13110f;padding:5px 8px;font-size:10px;color:#c3a983}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:10px} .section{grid-column:span 6;padding:14px} .wide{grid-column:span 12}
.section h3{font:500 19px Georgia,serif;color:#d6bb99;margin:0 0 10px;border-bottom:1px solid #302a24;padding-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} .card{border:1px solid #6c4c2d;background:linear-gradient(180deg,#17120d,#0a0a09);padding:12px}
.card .tier{font-size:9px;color:#b77c42;letter-spacing:.1em} .card b{display:block;color:#d89b52;margin-top:3px;font:600 15px Georgia,serif} .card small{display:block;color:#817970;margin-top:4px} .card p{font-size:11px;color:#aaa198;line-height:1.6;margin:7px 0 0}
.status{border-left:3px solid #8e3a29;background:#17110f;padding:9px 11px;color:#a99f94;font-size:10px;line-height:1.6} a{color:#bd9363;text-decoration:none}
@media(max-width:760px){.section{grid-column:span 12}.cards{grid-template-columns:1fr}.shell{padding:8px 8px 45px}.btn{font-size:12px;padding:9px 10px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="k">DIABLO IV · SEASON 15 · ALL CLASS ENDGAME LIBRARY</div><h1>시즌 15 · 8직업 엔드게임 라이브러리</h1>
<div class="sub">자동 갱신 2026-09-25 08:07 · 자동수집에 실패해도 기본 빌드 데이터는 유지합니다. 따라서 직업 내용이 통째로 사라지지 않습니다.</div></header>
<div class="tabs" id="classTabs"></div><div id="app"></div>
</div>
<script>
const DATA=[{"id": "barbarian", "name": "야만용사", "en": "Barbarian", "builds": [{"name": "회오리바람", "en": "Whirlwind", "tier": "S/A", "role": "광역 · 파밍/푸시"}, {"name": "선조의 망치", "en": "Hammer of the Ancients", "tier": "S/A", "role": "근접 · 보스"}, {"name": "돌진", "en": "Charge", "tier": "A", "role": "기동 · 푸시"}, {"name": "출혈 회오리바람", "en": "Whirlwind Bleed", "tier": "A", "role": "지속피해 · 푸시"}, {"name": "도약 지진", "en": "Leapquake", "tier": "A", "role": "광역 · 기동"}], "source": "https://d4guides.gg/en/builds?class=barbarian", "status": "수집 실패(HTTPError) · 기본 데이터 유지"}, {"id": "druid", "name": "드루이드", "en": "Druid", "builds": [{"name": "폭풍 칼날 발톱", "en": "Storm Shred", "tier": "S", "role": "근접 · 보스/푸시"}, {"name": "동료", "en": "Companion", "tier": "S/A", "role": "소환 · 안정"}, {"name": "산사태", "en": "Landslide", "tier": "A", "role": "대지 · 푸시"}, {"name": "번개 폭풍", "en": "Lightning Storm", "tier": "A", "role": "원거리 · 광역"}, {"name": "대격변", "en": "Cataclysm", "tier": "A", "role": "궁극기 · 광역"}], "source": "https://d4guides.gg/en/builds?class=druid", "status": "수집 실패(HTTPError) · 기본 데이터 유지"}, {"id": "necromancer", "name": "강령술사", "en": "Necromancer", "builds": [{"name": "골렘", "en": "Golem", "tier": "S", "role": "소환 · 보스"}, {"name": "망자의 군대", "en": "Army of the Dead", "tier": "A", "role": "소환 · 궁극기"}, {"name": "뼈 영혼", "en": "Bone Spirit", "tier": "A", "role": "폭딜 · 보스"}, {"name": "피의 파도", "en": "Blood Wave", "tier": "A", "role": "광역 · 제압"}, {"name": "미니언", "en": "Minion", "tier": "A", "role": "소환 · 안정"}], "source": "https://d4guides.gg/en/builds?class=necromancer", "status": "수집 실패(HTTPError) · 기본 데이터 유지"}, {"id": "rogue", "name": "도적", "en": "Rogue", "builds": [{"name": "독 주입 꿰뚫는 사격", "en": "Penetrating Shot", "tier": "S", "role": "원거리 · 푸시/보스"}, {"name": "냉기 연발 사격", "en": "Rapid Fire", "tier": "S/A", "role": "원거리 · 푸시"}, {"name": "독 주입 칼날의 춤", "en": "Dance of Knives", "tier": "A", "role": "기동 · 채널링"}, {"name": "냉기 화살비", "en": "Rain of Arrows", "tier": "A", "role": "광역 · 궁극기"}, {"name": "죽음의 덫", "en": "Death Trap", "tier": "A", "role": "덫 · 고기동"}], "source": "https://d4guides.gg/en/builds?class=rogue", "status": "수집 실패(HTTPError) · 기본 데이터 유지"}, {"id": "sorcerer", "name": "원소술사", "en": "Sorcerer", "builds": [{"name": "화염 고리", "en": "Ring of Fire", "tier": "S", "role": "화염 · 광역"}, {"name": "구상 번개", "en": "Ball Lightning", "tier": "S/A", "role": "번개 · 광역"}, {"name": "운석 낙하", "en": "Meteor", "tier": "A", "role": "화염 · 폭딜"}, {"name": "얼음 파편", "en": "Ice Shards", "tier": "A", "role": "냉기 · 원거리"}, {"name": "눈보라", "en": "Blizzard", "tier": "A", "role": "냉기 · 광역"}], "source": "https://d4guides.gg/en/builds?class=sorcerer", "status": "수집 실패(HTTPError) · 기본 데이터 유지"}, {"id": "spiritborn", "name": "혼령사", "en": "Spiritborn", "builds": [{"name": "역병 떼", "en": "Pestilent Swarm", "tier": "S", "role": "독 · 광역"}, {"name": "깃털 일제 사격", "en": "Quill Volley", "tier": "A/S", "role": "원거리 · 폭딜"}, {"name": "쇠약의 주먹", "en": "Withering Fist", "tier": "A", "role": "근접 · 독"}, {"name": "비상 떼", "en": "Soar Swarm", "tier": "A", "role": "기동 · 광역"}, {"name": "바위 쪼개기", "en": "Rock Splitter", "tier": "B/A", "role": "근접 · 안정"}], "source": "https://d4guides.gg/en/builds?class=spiritborn", "status": "수집 실패(HTTPError) · 기본 데이터 유지"}, {"id": "paladin", "name": "성기사", "en": "Paladin", "builds": [{"name": "해머딘", "en": "Hammerdin", "tier": "S", "role": "광역 · 푸시"}, {"name": "축복받은 방패", "en": "Blessed Shield", "tier": "S/A", "role": "방패 · 원거리"}, {"name": "오라딘", "en": "Auradin", "tier": "A", "role": "오라 · 광역"}, {"name": "날개 타격", "en": "Wing Strikes", "tier": "A", "role": "근접 · 기동"}, {"name": "중재자 해머딘", "en": "Arbiter Hammerdin", "tier": "A", "role": "해머 · 서약"}], "source": "https://d4guides.gg/en/builds?class=paladin", "status": "수집 실패(HTTPError) · 기본 데이터 유지"}, {"id": "warlock", "name": "흑마법사", "en": "Warlock", "builds": [{"name": "종말", "en": "Apocalypse", "tier": "S", "role": "원거리 · 광역"}, {"name": "타오르는 비명", "en": "Blazing Scream", "tier": "S/A", "role": "광역 · 파밍"}, {"name": "공포의 발톱", "en": "Dread Claws", "tier": "A", "role": "근접 · 악마형"}, {"name": "광인", "en": "Lunatic", "tier": "A", "role": "변신 · 푸시"}, {"name": "로드 러너", "en": "Road Runner", "tier": "A/B", "role": "속도 파밍"}], "source": "https://d4guides.gg/en/builds?class=warlock", "status": "수집 실패(HTTPError) · 기본 데이터 유지"}];
let cid="rogue", bi=0;
function render(){
 const c=DATA.find(x=>x.id===cid)||DATA[0], b=c.builds[bi]||c.builds[0];
 document.getElementById("app").innerHTML=`
 <section class="hero"><div class="k">${c.en.toUpperCase()}</div><h2>${c.name} · ${b.name}</h2>
 <div class="badges"><span class="badge">Tier ${b.tier}</span><span class="badge">${b.role}</span><span class="badge">${c.status}</span></div><div class="tabs" id="buildTabs"></div></section>
 <main class="grid">
 <section class="section wide"><h3>${c.name} 대표 엔드게임 빌드 5종</h3><div class="cards">${c.builds.map((x,i)=>`<div class="card"><div class="tier">#${i+1} · TIER ${x.tier}</div><b>${x.name}</b><small>${x.en}</small><p>${x.role}</p></div>`).join("")}</div></section>
 <section class="section"><h3>현재 선택 빌드</h3><div class="card"><div class="tier">TIER ${b.tier}</div><b>${b.name}</b><small>${b.en}</small><p>${b.role}</p></div></section>
 <section class="section"><h3>자동수집 상태</h3><div class="status">${c.status}</div><p style="font-size:11px;color:#817970;line-height:1.6">외부 사이트 구조가 바뀌거나 접속이 차단되어도 기본 빌드 5개는 유지됩니다.</p></section>
 <section class="section wide"><h3>출처</h3><a href="${b.url||c.source}" target="_blank" rel="noopener">원본 빌드/직업 페이지 열기</a></section>
 </main>`;
 const bt=document.getElementById("buildTabs");
 c.builds.forEach((x,i)=>{const q=document.createElement("button");q.className="btn"+(i===bi?" active":"");q.textContent=x.name;q.onclick=()=>{bi=i;render()};bt.appendChild(q)})
}
const ct=document.getElementById("classTabs");
DATA.forEach(c=>{const q=document.createElement("button");q.className="btn"+(c.id===cid?" active":"");q.textContent=c.name;q.onclick=()=>{cid=c.id;bi=0;document.querySelectorAll("#classTabs .btn").forEach(x=>x.classList.remove("active"));q.classList.add("active");render()};ct.appendChild(q)})
render();
</script>
</body></html>
